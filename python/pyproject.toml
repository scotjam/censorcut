[project]
name = "censorcut"
version = "0.1.0"
description = "Audio/visual analysis helpers for the CensorCut editor (M3+)"
requires-python = ">=3.9"
# Pure stdlib for M3. M4 adds tflite-runtime, soundfile, librosa.
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["censorcut*"]
