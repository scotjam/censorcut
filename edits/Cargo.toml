[package]
name = "censorcut-edits"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local-first edit-pack repository server for the CensorCut editor"
publish = false

# M8.5.1 ships only the schema + filesystem storage + CLI 'check'
# subcommand; the axum HTTP routes land in M8.5.2.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[[bin]]
name = "censorcut-edits"
path = "src/main.rs"
